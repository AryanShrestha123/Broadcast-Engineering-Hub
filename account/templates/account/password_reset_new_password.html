{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Broadcast Engineering Hub</title>
  <meta name="description" content="Broadcast Engineering Hub reset password page" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>
  <main class="main-content" style="padding: 36px 24px; max-width: 560px; margin: 0 auto;">
    <a href="{% url 'account:password_reset_verify' %}" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back</a>
    <div class="detail-header animate-in"><div><h1>Reset Password</h1><div class="dept">Enter a new password to regain access to your account.</div></div></div>
    <div style="max-width:480px">
      <div class="card animate-in">
        <form method="post" class="profile-form">
          {% csrf_token %}
          {% for field in form %}
          <div class="form-group">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <p style="color:var(--destructive);font-size:12px;margin-top:4px">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
          {% endfor %}
          <div class="form-actions" style="justify-content: space-between;">
            <a href="{% url 'account:password_reset_verify' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-primary">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="{% static 'js/icons.js' %}"></script>
</body>
</html>
