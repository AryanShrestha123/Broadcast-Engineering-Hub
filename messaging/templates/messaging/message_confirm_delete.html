{% extends "base.html" %}
{% block title %}Delete Message — Broadcast Engineering Hub{% endblock %}
{% block content %}
<a href="{% url 'message_detail' msg.pk %}" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to Message</a>
<div style="max-width:480px">
  <div class="card animate-in">
    <h2 style="color:var(--destructive)">Delete Message</h2>
    <p style="font-size:14px;margin-bottom:20px">Are you sure you want to delete the message "<strong>{{ msg.subject }}</strong>"?</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <a href="{% url 'message_detail' msg.pk %}" class="btn btn-secondary" style="text-decoration:none">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete Message</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
